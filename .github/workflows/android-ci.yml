name: Android CI

on:
  push:
    branches: [main, v1.4-release-candidate]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android API 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JavaScript and curated data
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/data.js
          node --check app/src/main/assets/v1-data.js
          node tools/validate-regulatory-data.mjs
          node tools/validate-ui-contract.mjs
          node tools/check-release-readiness.mjs --report-only

      - name: Unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log

      - name: Lint debug and release
        run: gradle --no-daemon --stacktrace :app:lintDebug :app:lintRelease

      - name: Build unsigned release AAB
        run: gradle --no-daemon --stacktrace :app:bundleRelease

      - name: Prepare artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NARADA-v1.4.0-rc1-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab NARADA-v1.4.0-rc1-unsigned.aab

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NARADA-v1.4.0-rc1-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload RC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NARADA-v1.4.0-rc1
          path: |
            NARADA-v1.4.0-rc1-debug.apk
            NARADA-v1.4.0-rc1-unsigned.aab
          if-no-files-found: error
          retention-days: 30
