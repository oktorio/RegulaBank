name: Android CI

on:
  push:
    branches: [main, v1.1-hardening, v1.2-data-integrity, v1.3.1-batik-checklists]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Materialize RegulaBank app icon
        run: |
          base64 --decode app/src/main/res/drawable/regulabank_logo.jpg.b64 > app/src/main/res/drawable/regulabank_logo.jpg
          rm app/src/main/res/drawable/regulabank_logo.jpg.b64

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NARADA-v1.3.9-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Lint
        run: gradle --no-daemon --stacktrace :app:lintDebug

      - name: Prepare installable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NARADA-v1.3.9-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NARADA-v1.3.9-debug-apk
          path: NARADA-v1.3.9-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p apk
          cp NARADA-v1.3.9-debug.apk apk/NARADA-v1.3.9-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/NARADA-v1.3.9-debug.apk
          git diff --cached --quiet || git commit -m "Publish NARADA v1.3.9 APK"
          git push
