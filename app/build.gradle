plugins {
    id "com.android.application"
}

def releaseKeystorePath = System.getenv("NARADA_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("NARADA_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("NARADA_KEY_ALIAS")
def releaseKeyPassword = System.getenv("NARADA_KEY_PASSWORD")
def releaseSigningAvailable = releaseKeystorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace "id.regulabank.app"
    compileSdk 36

    defaultConfig {
        applicationId "id.regulabank.app"
        minSdk 24
        targetSdk 36
        versionCode 27
        versionName "1.4.0-rc1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (releaseSigningAvailable) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    packaging {
        resources {
            excludes += [
                    "META-INF/DEPENDENCIES",
                    "META-INF/LICENSE",
                    "META-INF/LICENSE.txt",
                    "META-INF/NOTICE",
                    "META-INF/NOTICE.txt"
            ]
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix ""
        }
        release {
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.release
            }
            // Keep shrinking disabled until the PDFBox/WebView release path has device-level regression coverage.
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation "androidx.activity:activity:1.13.0"
    implementation "androidx.core:core:1.18.0"
    implementation "androidx.webkit:webkit:1.17.1"
    implementation "com.tom-roush:pdfbox-android:2.0.27.0"

    testImplementation "junit:junit:4.13.2"
}
