plugins {
    id "com.android.application"
}

android {
    namespace "id.regulabank.app"
    compileSdk 35

    defaultConfig {
        applicationId "id.regulabank.app"
        minSdk 24
        targetSdk 35
        versionCode 20
        versionName "1.3.6"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                    "META-INF/DEPENDENCIES",
                    "META-INF/LICENSE",
                    "META-INF/LICENSE.txt",
                    "META-INF/NOTICE",
                    "META-INF/NOTICE.txt"
            ]
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix ""
        }
        release {
            // Keep shrinking disabled until WebView bridge/PDFBox release rules are covered by CI tests.
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation "com.tom-roush:pdfbox-android:2.0.27.0"
}
